name: MVP CI
on:
  push:
    branches: [mvp/freelance-growth-os]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Unit tests
        run: npm test
      - name: Parse browser app JS
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import vm from 'node:vm'; const s=fs.readFileSync('index.html','utf8').match(/<script>([\s\S]*?)<\/script>/)?.[1]; if (!s) process.exit(1); new vm.Script(s);"
